<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/job-icon.svg" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>JobPortal | Find Jobs & Hire Top Talent</title>
  <meta name="description"
    content="JobPortal is a modern job search platform where candidates can find opportunities and companies can hire skilled professionals." />
  <meta name="keywords"
    content="jobs, job portal, careers, employment, hiring, recruitment, internships, developers, remote jobs" />
  <meta name="author" content="Lakshay" />

  <!-- Theme -->
  <meta name="theme-color" content="#2563eb" />

  <!-- Open Graph (Facebook, LinkedIn sharing) -->
  <meta property="og:title" content="JobPortal | Find Your Dream Job" />
  <meta property="og:description"
    content="Search jobs, explore career opportunities, and connect with companies looking for talented professionals." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://your-domain.com" />
  <meta property="og:image" content="/job-preview.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="JobPortal | Find Your Dream Job" />
  <meta name="twitter:description" content="A modern job platform connecting job seekers with employers." />
  <meta name="twitter:image" content="/job-preview.png" />

  <!-- Prevent browser styling issues -->
  <meta name="color-scheme" content="light" />

</head>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
